deploy_production:
  stage: deploy
  environment:
    name: production
    url: https://docusign.code-li.com
  only:
    - main
  # when: manual
  script:
    - bundle exec cap production deploy

restart_production:
  stage: deploy
  environment:
    name: production
    url: https://docusign.code-li.com
  only:
    - main
  when: manual
  script:
    - bundle exec cap production puma:smart_restart
