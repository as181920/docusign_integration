before_script:
  - pwd
  - rvm use || rvm install $(<.ruby-version)
  - ruby -v
  - bundle install -j $(nproc)
  # - echo -e "machine gitlab.dd-life.com\nlogin ${CI_USER}\npassword ${CI_PAT}" > ~/.netrc
  - git lfs install
  - git lfs version

stages:
  - rubocop
  - test
  - audit
  - deploy

rubocop:
  stage: rubocop
  when: always
  script:
    - bin/rails rubocop

test:
  stage: test
  only:
    - main
  script:
    - bundle install -j $(nproc)
    - ln -s /home/gitlab-runner/shared/configs/huawan/docusign-integration/database.yml ./config/database.yml
    - ln -s /home/gitlab-runner/shared/configs/huawan/docusign-integration/local_env.yml ./config/local_env.yml
    - bin/rails db:drop RAILS_ENV=test
    - bin/rails db:create RAILS_ENV=test
    - bin/rails db:migrate RAILS_ENV=test
    - bin/rails test

audit:
  stage: audit
  script:
    - bin/rails bundle:audit:check

